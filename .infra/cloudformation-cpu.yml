# =============================
# Generic Dev Environment - CPU Instance Template
# =============================
AWSTemplateFormatVersion: '2010-09-09'
Description: Generic Dev Environment - CPU Instance with Docker + EBS (Reusable Template)

Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming (e.g., qcbm, myproject)
    AllowedPattern: ^[a-z][a-z0-9-]*[a-z0-9]$
    ConstraintDescription: Must start with lowercase letter, contain only lowercase letters, numbers, and hyphens
  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.medium
      - t3.large
      - t3.xlarge
      - t3.2xlarge
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - t4g.2xlarge
      - m5.large
      - m5.xlarge
      - m5.2xlarge
      - m6g.large
      - m6g.xlarge
      - m6g.2xlarge
      - c5.large
      - c5.xlarge
      - c6g.large
      - c6g.xlarge
      - c7g.2xlarge
      - m7i.4xlarge
    Description: CPU instance type for testing (supports both x86_64 and ARM64 architectures)
  VolumeSize:
    Type: Number
    Default: 50
    Description: Size of the EBS volume in GiB
  SSHPublicKey:
    Type: String
    Description: SSH public key to be added to authorized_keys for EC2 access
    AllowedPattern: ^ssh-(rsa|ed25519|ecdsa) [A-Za-z0-9+/]+(={0,2})( .*)?$
    ConstraintDescription: Must be a valid SSH public key
  SSHPrivateKey:
    Type: String
    Description: SSH private key to be injected into the container for Git operations
    NoEcho: true
    MinLength: 1
    ConstraintDescription: SSH private key is required
  GitRepository:
    Type: String
    Description: Git repository URL to clone
  GitBranch:
    Type: String
    Description: Git branch to checkout
  SetupScriptOrg:
    Type: String
    Description: GitHub organization containing the setup script
    MinLength: 1
    ConstraintDescription: Setup script organization name is required
  SetupScriptRepo:
    Type: String
    Description: GitHub repository containing the setup script
    MinLength: 1
    ConstraintDescription: Setup script repository name is required
  SetupScriptBranch:
    Type: String
    Description: Branch containing the setup script
    MinLength: 1
    ConstraintDescription: Setup script branch name is required
  SetupScriptPath:
    Type: String
    Description: Path to the setup script in the repository
    MinLength: 1
    AllowedPattern: ^[a-zA-Z0-9/_.-]+$
    ConstraintDescription: Setup script path must be a valid file path and is required

Mappings:
  # AMI mappings for different architectures in ap-northeast-2 (Seoul)
  ArchitectureMap:
    # x86_64 instance types (Ubuntu 22.04 LTS)
    t3.medium:
      AMI: ami-0c9c942bd7bf113a2
    t3.large:
      AMI: ami-0c9c942bd7bf113a2
    t3.xlarge:
      AMI: ami-0c9c942bd7bf113a2
    t3.2xlarge:
      AMI: ami-0c9c942bd7bf113a2
    m5.large:
      AMI: ami-0c9c942bd7bf113a2
    m5.xlarge:
      AMI: ami-0c9c942bd7bf113a2
    m5.2xlarge:
      AMI: ami-0c9c942bd7bf113a2
    c5.large:
      AMI: ami-0c9c942bd7bf113a2
    c5.xlarge:
      AMI: ami-0c9c942bd7bf113a2
    m7i.4xlarge:
      AMI: ami-0c9c942bd7bf113a2
    # ARM64 instance types (Ubuntu 22.04 LTS - Graviton)
    t4g.medium:
      AMI: ami-01123b84e2a4fba05
    t4g.large:
      AMI: ami-01123b84e2a4fba05
    t4g.xlarge:
      AMI: ami-01123b84e2a4fba05
    t4g.2xlarge:
      AMI: ami-01123b84e2a4fba05
    m6g.large:
      AMI: ami-01123b84e2a4fba05
    m6g.xlarge:
      AMI: ami-01123b84e2a4fba05
    m6g.2xlarge:
      AMI: ami-01123b84e2a4fba05
    c6g.large:
      AMI: ami-01123b84e2a4fba05
    c6g.xlarge:
      AMI: ami-01123b84e2a4fba05
    c7g.2xlarge:
      AMI: ami-01123b84e2a4fba05

Resources:
  ProjectSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Allow SSH, VSCode, Docker SSH, and Jupyter for ${ProjectName}'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8888
          ToPort: 8888
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-SecurityGroup'
        - Key: Project
          Value: !Ref ProjectName

  ProjectInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [ArchitectureMap, !Ref InstanceType, AMI]
      AvailabilityZone: !Select [0, !GetAZs '']
      SecurityGroupIds:
        - !Ref ProjectSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sdf
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-DevInstance-CPU'
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Manually inject the public and private keys for initial SSH access and Git
          mkdir -p "/home/ubuntu/.ssh"

          # Inject public key for SSH access to EC2
          echo '${SSHPublicKey}' > "/home/ubuntu/.ssh/authorized_keys"

          # Inject the same public key and private key as standard file names
          echo '${SSHPublicKey}' > "/home/ubuntu/.ssh/id_ed25519_github_qb_frontier.pub"
          echo '${SSHPrivateKey}' > "/home/ubuntu/.ssh/id_ed25519_github_qb_frontier"

          # Set correct permissions
          chown -R ubuntu:ubuntu "/home/ubuntu/.ssh"
          chmod 700 "/home/ubuntu/.ssh"
          chmod 600 "/home/ubuntu/.ssh/authorized_keys"
          chmod 644 "/home/ubuntu/.ssh/id_ed25519_github_qb_frontier.pub"
          chmod 600 "/home/ubuntu/.ssh/id_ed25519_github_qb_frontier"
          echo "Public and private keys for EC2 access and Git have been injected."

          # Export variables for the setup script to use.
          # Note: The setup script will re-read these from the files for consistency.
          export SSHPublicKey='${SSHPublicKey}'
          export SSHPrivateKey='${SSHPrivateKey}'

          # Construct and run the main setup script
          SETUP_SCRIPT_URL="https://raw.githubusercontent.com/${SetupScriptOrg}/${SetupScriptRepo}/${SetupScriptBranch}/${SetupScriptPath}"
          echo "Downloading setup script from: $SETUP_SCRIPT_URL"

          # Download and verify setup script
          if ! curl -fsSL "$SETUP_SCRIPT_URL" -o /tmp/setup.sh; then
            echo "ERROR: Failed to download setup script from $SETUP_SCRIPT_URL"
            exit 1
          fi

          if [ ! -s /tmp/setup.sh ]; then
            echo "ERROR: Downloaded setup script is empty"
            exit 1
          fi

          chmod +x /tmp/setup.sh
          /tmp/setup.sh \
            --project ${ProjectName} \
            --instance-type ${InstanceType} \
            --volume-size ${VolumeSize} \
            --git ${GitRepository} \
            --branch ${GitBranch}

  ProjectElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ElasticIP'
        - Key: Project
          Value: !Ref ProjectName

  ProjectEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref ProjectInstance
      EIP: !Ref ProjectElasticIP

Outputs:
  StaticIP:
    Description: Elastic IP address
    Value: !Ref ProjectElasticIP

  JupyterURL:
    Description: Jupyter Notebook URL
    Value: !Sub 'http://${ProjectElasticIP}:8888 (token: ${ProjectName}token)'

  VSCodeURL:
    Description: VSCode Web URL (if container running)
    Value: !Sub 'http://${ProjectElasticIP}:8080'

  ContainerSSH:
    Description: SSH access to container (port 2222)
    Value: !Sub 'ssh -p 2222 devuser@${ProjectElasticIP}'

  EC2SSH:
    Description: SSH access to EC2 instance
    Value: !Sub 'ssh ubuntu@${ProjectElasticIP}'

  InstanceType:
    Description: Instance type and billing
    Value: !Sub '${InstanceType} (${ProjectName} CPU Testing)'

  NextSteps:
    Description: What to do next
    Value: !Sub 'Test ${ProjectName} environment with Jupyter, then request GPU quota for g4dn.2xlarge'
