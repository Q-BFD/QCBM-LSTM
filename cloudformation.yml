# =============================
# 1. CloudFormation Template
# =============================
AWSTemplateFormatVersion: '2010-09-09'
Description: QCBM Dev Env - EC2 with GPU Docker + EBS + Elastic IP + Inject SSH Key + Spot Instance Support

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair
  InstanceType:
    Type: String
    Default: g4dn.2xlarge
    AllowedValues:
      - g4dn.xlarge
      - g4dn.2xlarge
      - g4dn.4xlarge
      - g5.xlarge
      - g5.2xlarge
      - g5.4xlarge
      - p3.2xlarge
    Description: GPU-enabled EC2 instance type for quantum ML workloads
  UseSpotInstance:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Use Spot Instance to save 60-90% on costs (recommended for development)
  SpotMaxPrice:
    Type: String
    Default: '0.50'
    Description: Maximum price per hour for Spot Instance (current g4dn.2xlarge ~$0.22/hour)
  VolumeSize:
    Type: Number
    Default: 100
    Description: Size of the EBS volume in GiB (increased for GPU packages)
  SSHPublicKey:
    Type: String
    Description: SSH public key to be added to authorized_keys (paste your ~/.ssh/id_rsa.pub content here)
    AllowedPattern: ^ssh-(rsa|ed25519|ecdsa) [A-Za-z0-9+/]+(={0,2})( .*)?$
    ConstraintDescription: Must be a valid SSH public key

Conditions:
  UseSpot: !Equals [!Ref UseSpotInstance, 'true']

Resources:
  QcbmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, VSCode, and Docker SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0

  QcbmVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref VolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: QCBMDataVolume

  QcbmInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: ami-08943a151bd468f4e # Ubuntu 22.04 (seoul) - Updated 2025-05-16
      SecurityGroupIds:
        - !Ref QcbmSecurityGroup
      InstanceMarketOptions: !If
        - UseSpot
        - MarketType: spot
          SpotOptions:
            MaxPrice: !Ref SpotMaxPrice
            SpotInstanceType: one-time
        - !Ref 'AWS::NoValue'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e  # Exit on any error

          # Logging function
          log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a /var/log/qcbm-setup.log
          }

          log "Starting QCBM development environment setup..."
          log "💰 Instance Type: ${InstanceType} (Spot: ${UseSpotInstance})"

          # Update system and install packages
          log "Updating system and installing packages..."
          apt update && apt install -y \
              git \
              docker.io \
              python3-pip \
              awscli \
              curl \
              wget \
              unzip \
              nodejs \
              openssh-server \
              jq \
              lsblk

          # Configure Docker
          log "Configuring Docker..."
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu

          # Find and mount EBS volume automatically
          log "Finding EBS volume..."

          # Wait for EBS volume to be attached
          for i in {1..30}; do
              # Find unformatted volume (excluding root volume) - Updated size search
              DEVICE=$(lsblk -n -o NAME,MOUNTPOINT,SIZE | grep -v "/" | grep -E "(50G|100G)" | head -1 | awk '{print $1}')
              if [ ! -z "$DEVICE" ]; then
                  # Convert to full device path
                  if [[ $DEVICE == nvme* ]]; then
                      EBS_DEVICE="/dev/$DEVICE"
                  else
                      EBS_DEVICE="/dev/$DEVICE"
                  fi
                  log "Found EBS volume: $EBS_DEVICE"
                  break
              fi
              log "Waiting for EBS volume... (attempt $i/30)"
              sleep 10
          done

          if [ -z "$EBS_DEVICE" ]; then
              log "ERROR: Could not find EBS volume"
              exit 1
          fi

          # Format and mount EBS volume
          log "Formatting and mounting EBS volume: $EBS_DEVICE"
          mkdir -p /mnt/data

          # Check if already formatted
          if ! blkid "$EBS_DEVICE" > /dev/null 2>&1; then
              log "Formatting $EBS_DEVICE with ext4..."
              mkfs.ext4 "$EBS_DEVICE"
          fi

          # Mount the volume
          mount "$EBS_DEVICE" /mnt/data
          echo "$EBS_DEVICE /mnt/data ext4 defaults,nofail 0 2" >> /etc/fstab

          # Set permissions
          chown ubuntu:ubuntu /mnt/data

          # Clone repository
          log "Cloning QCBM-LSTM repository..."
          cd /mnt/data
          if [ ! -d "QCBM-LSTM" ]; then
              git clone -b automation https://github.com/Q-BFD/QCBM-LSTM.git
              chown -R ubuntu:ubuntu QCBM-LSTM
          fi

          # Install Python requirements (if requirements.txt exists)
          if [ -f "/mnt/data/QCBM-LSTM/requirements.txt" ]; then
              log "Installing Python requirements..."
              pip3 install -r /mnt/data/QCBM-LSTM/requirements.txt
          fi

          # Set up SSH keys for container
          log "Setting up SSH keys..."
          mkdir -p /home/ubuntu/.ssh
          echo "${SSHPublicKey}" >> /home/ubuntu/.ssh/authorized_keys
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          chown -R ubuntu:ubuntu /home/ubuntu/.ssh

          # Extract the SSH public key for container use
          SSH_KEY_FOR_CONTAINER="${SSHPublicKey}"

          # Build and run Docker container
          log "Building Docker image..."
          cd /mnt/data/QCBM-LSTM

          # Wait for Docker to be ready
          until docker info > /dev/null 2>&1; do
              log "Waiting for Docker to be ready..."
              sleep 5
          done

          # Build Docker image
          if [ -f "Dockerfile" ]; then
              docker build -t qcbm-dev .
              log "Docker image built successfully"
          else
              log "ERROR: Dockerfile not found"
              exit 1
          fi

          # Stop existing container if running
          docker stop qcbm-dev 2>/dev/null || true
          docker rm qcbm-dev 2>/dev/null || true

          # Run Docker container
          log "Starting Docker container..."
          docker run -d \
            --name qcbm-dev \
            -p 8080:8080 \
            -p 2222:22 \
            -v /mnt/data:/mnt/data \
            -v /mnt/data/QCBM-LSTM:/home/devuser/workspace \
            --restart unless-stopped \
            qcbm-dev

          # Wait for container to be ready
          log "Waiting for container to be ready..."
          sleep 10

          # Configure SSH key in container
          log "Configuring SSH key in container..."
          docker exec qcbm-dev /bin/bash -c "
              echo '$SSH_KEY_FOR_CONTAINER' > /home/devuser/.ssh/authorized_keys && \
              chmod 600 /home/devuser/.ssh/authorized_keys && \
              chown devuser:devuser /home/devuser/.ssh/authorized_keys
          "

          # Verify container is running
          if docker ps | grep -q qcbm-dev; then
              log "✅ Container is running successfully"
          else
              log "❌ Container failed to start"
              docker logs qcbm-dev
              exit 1
          fi

          # Create status file
          echo "QCBM development environment setup completed at $(date)" > /mnt/data/setup-complete.txt

          log "🎉 QCBM development environment setup completed successfully!"
          log "💰 Spot Instance saved you 60-90% on costs!"
          log "📋 Services available:"
          log "   - VSCode Web: http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4):8080"
          log "   - SSH to container: ssh devuser@$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4) -p 2222"
          log "   - SSH to EC2: ssh ubuntu@$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"

  VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref QcbmInstance
      VolumeId: !Ref QcbmVolume
      Device: /dev/xvdf

  QcbmElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  QcbmEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref QcbmInstance
      EIP: !Ref QcbmElasticIP

Outputs:
  StaticIP:
    Description: Elastic IP address
    Value: !Ref QcbmElasticIP

  VSCodeURL:
    Description: VSCode Web URL
    Value: !Sub 'http://${QcbmElasticIP}:8080'

  ContainerSSH:
    Description: SSH access to container (port 2222)
    Value: !Sub 'ssh -p 2222 devuser@${QcbmElasticIP}'
